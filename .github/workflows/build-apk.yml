name: Build and Release OKCRICK APK

on:
  workflow_dispatch:
  push:
    paths:
      - "public/logo.png"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Image Tools
        run: python -m pip install Pillow

      - name: Verify Logo
        run: |
          python - <<'PY'
          from PIL import Image

          path = "public/logo.png"
          try:
              image = Image.open(path)
              image.verify()

              image = Image.open(path)
              print("Logo format:", image.format)
              print("Logo size:", image.size)
              print("Logo transparency:", "A" in image.getbands())
          except Exception as e:
              print("Invalid logo:", e)
              raise SystemExit(1)
          PY

      - name: Generate Transparent Logo Assets
        run: |
          mkdir -p apk-wrapper/assets
          mkdir -p apk-wrapper/www

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          out = Path("apk-wrapper/assets")
          logo = Image.open("public/logo.png").convert("RGBA")

          # Preserve original transparent pixels.
          # Do not flatten the logo onto a black background.
          def make_canvas(size, fraction, bg=(11, 122, 69, 255)):
              canvas = Image.new("RGBA", (size, size), bg)
              artwork = logo.copy()
              artwork.thumbnail(
                  (int(size * fraction), int(size * fraction)),
                  Image.Resampling.LANCZOS
              )

              canvas.alpha_composite(
                  artwork,
                  ((size - artwork.width) // 2,
                   (size - artwork.height) // 2)
              )
              return canvas

          # App launcher icon
          make_canvas(1024, 0.78).save(out / "icon.png")

          # Adaptive launcher icon foreground: keep it transparent
          foreground = Image.new(
              "RGBA", (1024, 1024), (0, 0, 0, 0)
          )
          artwork = logo.copy()
          artwork.thumbnail(
              (780, 780), Image.Resampling.LANCZOS
          )
          foreground.alpha_composite(
              artwork,
              ((1024 - artwork.width) // 2,
               (1024 - artwork.height) // 2)
          )
          foreground.save(out / "icon-foreground.png")

          Image.new(
              "RGBA", (1024, 1024), "#0B7A45"
          ).save(out / "icon-background.png")

          # Splash artwork: transparent logo on green brand background.
          # Android itself does not support a fully transparent
          # launch-screen background.
          make_canvas(2732, 0.42).save(out / "splash.png")
          make_canvas(2732, 0.42).save(out / "splash-dark.png")

          # White monochrome Android notification icon
          artwork = logo.copy()
          alpha = artwork.getchannel("A")

          if alpha.getbbox():
              artwork.putalpha(alpha)
              artwork = artwork.crop(alpha.getbbox())

          artwork.thumbnail((72, 72), Image.Resampling.LANCZOS)

          notification = Image.new(
              "RGBA", (96, 96), (0, 0, 0, 0)
          )
          white = Image.new(
              "RGBA", artwork.size, (255, 255, 255, 255)
          )
          white.putalpha(artwork.getchannel("A"))
          notification.alpha_composite(
              white,
              ((96 - artwork.width) // 2,
               (96 - artwork.height) // 2)
          )
          notification.save("apk-wrapper/ic_stat_okcrick.png")
          PY

      - name: Create Capacitor Android Project
        working-directory: apk-wrapper
        run: |
          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/splash-screen@7 \
            @capacitor/local-notifications@7

          npm install --save-dev \
            @capacitor/cli@7 \
            @capacitor/assets@3

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.okcrick.app",
            "appName": "OKCRICK",
            "webDir": "www",
            "server": {
              "url": "https://okcrick.in",
              "cleartext": false
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 10000,
                "launchAutoHide": true,
                "launchFadeOutDuration": 250,
                "backgroundColor": "#0B7A45",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_INSIDE",
                "showSpinner": false
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_okcrick",
                "iconColor": "#20C878"
              }
            }
          }
          EOF

          echo '<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>' > www/index.html

          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Apply Notification Icon
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path("apk-wrapper/android/app/src/main/res")
          target = root / "drawable"
          target.mkdir(parents=True, exist_ok=True)

          shutil.copy(
              "apk-wrapper/ic_stat_okcrick.png",
              target / "ic_stat_okcrick.png"
          )

          manifest = Path(
              "apk-wrapper/android/app/src/main/AndroidManifest.xml"
          )
          content = manifest.read_text()

          metadata = (
              '<meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_stat_okcrick" />'
          )

          if "com.google.firebase.messaging.default_notification_icon" not in content:
              content = content.replace(
                  "</application>",
                  metadata + "\n    </application>",
                  1
              )
              manifest.write_text(content)
          PY

      - name: Build Installable APK
        working-directory: apk-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/OKCRICK.apk"

      - name: Publish Public APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OKCRICK APK v1.0.${{ github.run_number }}
          body: |
            OKCRICK Android app.
            Direct APK download below.
          files: OKCRICK.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
