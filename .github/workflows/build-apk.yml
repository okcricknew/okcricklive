name: Build and Release OKCRICK APK

on:
  workflow_dispatch:
  push:
    paths:
      - "public/logo.png"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Logo
        run: |
          test -f public/logo.png || {
            echo "Missing public/logo.png"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Image Tools
        run: python -m pip install Pillow

      - name: Prepare Notification Icon
        run: |
          mkdir -p apk-wrapper/assets
          mkdir -p apk-wrapper/www

          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path

          original = Image.open("public/logo.png").convert("RGBA")

          # Android status-bar notification icon: white artwork with transparent background
          rgba = original.copy()
          alpha = rgba.getchannel("A")

          if alpha.getextrema() == (255, 255):
              rgb = rgba.convert("RGB")
              corner = rgb.getpixel((0, 0))
              background = Image.new("RGB", rgb.size, corner)
              diff = ImageChops.difference(rgb, background).convert("L")
              alpha = diff.point(
                  lambda p: 255 if p > 45 else 0
              )

          bbox = alpha.getbbox()
          if bbox:
              alpha = alpha.crop(bbox)
          alpha.thumbnail((80, 80), Image.Resampling.LANCZOS)

          icon = Image.new("RGBA", (96, 96), (0, 0, 0, 0))
          white = Image.new("RGBA", alpha.size, (255, 255, 255, 255))
          white.putalpha(alpha)
          icon.alpha_composite(
              white, ((96-alpha.width)//2, (96-alpha.height)//2)
          )
          icon.save("apk-wrapper/ic_stat_okcrick.png")
          PY

      - name: Create Capacitor Android Project
        working-directory: apk-wrapper
        run: |
          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/splash-screen@7 \
            @capacitor/local-notifications@7

          npm install --save-dev \
            @capacitor/cli@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "in.okcrick.app",
            "appName": "OKCRICK",
            "webDir": "www",
            "server": {
              "url": "https://okcrick.in",
              "cleartext": false
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#07110b",
                "androidScaleType": "CENTER_INSIDE",
                "showSpinner": false
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_okcrick",
                "iconColor": "#20C878"
              }
            }
          }
          EOF

          echo '<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>' > www/index.html

          npx cap add android
          npx cap sync android

      - name: Apply Exact Logo as App Icon and Splash Screen
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          original = Image.open("public/logo.png").convert("RGBA")
          res_dir = Path("apk-wrapper/android/app/src/main/res")

          # Exact sizes for Android launcher icons (bypasses adaptive icon masks & borders)
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_folder = res_dir / folder
              target_folder.mkdir(parents=True, exist_ok=True)
              
              resized = original.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(target_folder / "ic_launcher.png")
              resized.save(target_folder / "ic_launcher_round.png")

          # Splash screen setup using exact logo without white screen flash
          drawable_dir = res_dir / "drawable"
          drawable_dir.mkdir(parents=True, exist_ok=True)
          
          splash_resized = original.resize((1024, 1024), Image.Resampling.LANCZOS)
          splash_resized.save(drawable_dir / "splash.png")

          # Copy notification icon
          import shutil
          shutil.copy(
              "apk-wrapper/ic_stat_okcrick.png",
              drawable_dir / "ic_stat_okcrick.png"
          )

          # Ensure AndroidManifest has notification icon meta-data
          manifest = Path(
              "apk-wrapper/android/app/src/main/AndroidManifest.xml"
          )
          content = manifest.read_text()

          metadata = (
              '<meta-data '
              'android:name="com.google.firebase.messaging.default_notification_icon" '
              'android:resource="@drawable/ic_stat_okcrick" />'
          )

          if "com.google.firebase.messaging.default_notification_icon" not in content:
              if "</application>" not in content:
                  raise SystemExit("AndroidManifest application tag missing")
              content = content.replace(
                  "</application>",
                  metadata + "\n    </application>",
                  1
              )
              manifest.write_text(content)
          PY

      - name: Build Installable APK
        working-directory: apk-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/OKCRICK.apk"

      - name: Publish Public APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OKCRICK APK v1.0.${{ github.run_number }}
          body: |
            OKCRICK Android app.
            Direct APK download below.
          files: OKCRICK.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
